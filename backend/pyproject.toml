[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-doctor-backend"
version = "0.1.0"
description = "LangGraph orchestration layer for the Skill Doctor agent."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.1,<2",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
observability = [
  "langsmith>=0.4.25,<1",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=7.4,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skilldoctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=../.pytest-tmp"
