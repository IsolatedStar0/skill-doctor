name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install backend test dependencies
        run: python -m pip install -e "backend[dev,api,observability]"

      - name: Install CLI package
        run: python -m pip install -e skilldoctor-cli

      - name: Build frontend
        run: npm run build

      - name: Run Node tests
        run: node --experimental-strip-types --test "tests/*.test.mjs"

      - name: Run Python tests
        run: python -m pytest backend/tests -q --basetemp=.pytest-tmp

      - name: Run CLI tests
        run: python -m pytest skilldoctor-cli/tests -q --basetemp=../.pytest-tmp-cli

      - name: Run CLI smoke workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pytest-tmp-cli-smoke

          set +e
          skilldoctor \
            --project-root "$PWD" \
            diagnose skilldoctor-cli/examples/traces/failed-skill-trace.json \
            --json-out .pytest-tmp-cli-smoke/diagnose.json \
            --md-out .pytest-tmp-cli-smoke/diagnose.md \
            --quiet
          diagnose_code=$?
          set -e
          test "$diagnose_code" -eq 10

          skilldoctor \
            --project-root "$PWD" \
            repair-preview .pytest-tmp-cli-smoke/diagnose.json \
            --json-out .pytest-tmp-cli-smoke/repair-preview.json \
            --md-out .pytest-tmp-cli-smoke/repair-preview.md \
            --quiet

          skilldoctor \
            --project-root "$PWD" \
            evaluate skilldoctor-cli/examples/traces/healthy-skill-trace.json \
            --min-score 0.60 \
            --min-output-quality 0.90 \
            --min-contract-compliance 0.90 \
            --min-evidence-support 0.50 \
            --min-cost-efficiency 0.90 \
            --min-safety-boundary 0.80 \
            --min-stability 0.90 \
            --json-out .pytest-tmp-cli-smoke/evaluate.json \
            --md-out .pytest-tmp-cli-smoke/evaluate.md \
            --quiet

          skilldoctor \
            --project-root "$PWD" \
            bench skilldoctor-cli/examples/cases/release-checklist.jsonl \
            --include-tag release \
            --json-out .pytest-tmp-cli-smoke/bench.json \
            --md-out .pytest-tmp-cli-smoke/bench.md \
            --quiet

          skilldoctor \
            --project-root "$PWD" \
            compare .pytest-tmp-cli-smoke/bench.json .pytest-tmp-cli-smoke/bench.json \
            --max-quality-drop 0.05 \
            --max-cost-increase-rate 1.00 \
            --max-safety-drop 0.05 \
            --json-out .pytest-tmp-cli-smoke/compare.json \
            --md-out .pytest-tmp-cli-smoke/compare.md \
            --quiet

          skilldoctor \
            --project-root "$PWD" \
            compare \
            --baseline .pytest-tmp-cli-smoke/bench.json \
            .pytest-tmp-cli-smoke/bench.json \
            --json-out .pytest-tmp-cli-smoke/compare-baseline.json \
            --quiet

          skilldoctor \
            --project-root "$PWD" \
            baseline save .pytest-tmp-cli-smoke/bench.json \
            --name main \
            --force

          skilldoctor \
            --project-root "$PWD" \
            baseline list

          skilldoctor \
            --project-root "$PWD" \
            compare \
            --baseline-name main \
            .pytest-tmp-cli-smoke/bench.json \
            --json-out .pytest-tmp-cli-smoke/compare-named-baseline.json \
            --quiet

          skilldoctor \
            --project-root "$PWD" \
            compare .pytest-tmp-cli-smoke/bench.json \
            --json-out .pytest-tmp-cli-smoke/compare-auto-baseline.json \
            --quiet

          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            cat .pytest-tmp-cli-smoke/compare.md >> "$GITHUB_STEP_SUMMARY"
          fi

          skilldoctor \
            --project-root "$PWD" \
            report .pytest-tmp-cli-smoke/bench.json \
            --md-out .pytest-tmp-cli-smoke/report.md

      - name: Verify benchmark summary generation
        run: npm run bench:summary
